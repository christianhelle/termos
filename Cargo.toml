[package]
name = "cosmoscli"
version = "0.1.0"
edition = "2024"
description = "Command line tool for Azure Cosmos DB"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
azure_core = { version = "1.1.0", default-features = false }
azure_data_cosmos = { version = "=0.38.0", features = ["key_auth"] }
azure_identity = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
