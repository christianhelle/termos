[package]
name = "termos"
description = "Terminal user interface for Azure Cosmos DB"
version = "0.1.0"
edition = "2024"
authors = ["Christian Helle"]
license = "MIT"
homepage = "https://github.com/christianhelle/termos"
repository = "https://github.com/christianhelle/termos"
readme = "README.md"
keywords = ["azure", "cosmosdb", "tui", "terminal", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
async-trait = "0.1"
azure_core = { version = "1.1.0", default-features = false }
azure_data_cosmos = { version = "=0.38.0", features = ["key_auth", "control_plane"] }
azure_identity = "1.0"
clap = { version = "4.6.7", features = ["derive", "string"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
