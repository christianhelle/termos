[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
azure_core = { version = "1.1.0", default-features = false }
azure_data_cosmos = { version = "=0.38.0", features = ["key_auth"] }
azure_identity = "1.0"
clap = { version = "4.6.7", features = ["derive", "string"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
